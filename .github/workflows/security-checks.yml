name: security-checks

on:
  push:
    branches: [main, nimi-agent-foundation, "feature/**", "security/**", "release/**"]
  pull_request:
    branches: [main, nimi-agent-foundation, "feature/**"]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit bandit
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Check custom browser JavaScript syntax
        run: node --check public/pwa.js
      - name: Audit installed Python dependencies
        run: pip-audit
      - name: Scan application code for common security issues
        run: bandit -q -r . -x ./tests,./.git
