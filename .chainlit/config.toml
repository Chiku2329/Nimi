[project]
user_env = []
session_timeout = 3600
user_session_timeout = 1296000
cache = false
persist_user_env = false
mask_user_env = false
allow_origins = ["https://nimi.blitz.cloud", "https://nimi.prod.page"]

[features]
unsafe_allow_html = false
latex = false
user_message_markdown = true
user_message_autoscroll = true
assistant_message_autoscroll = true
auto_tag_thread = true
edit_message = true
allow_thread_sharing = false
favorites = false

[features.slack]
reaction_on_message_received = false

[features.spontaneous_file_upload]
enabled = true
accept = [
  "application/pdf",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  "application/vnd.openxmlformats-officedocument.presentationml.presentation",
  "text/*",
  "text/plain",
  "text/markdown",
  "text/csv",
  "text/tab-separated-values",
  "application/json",
  "application/ld+json",
  "application/xml",
  "text/xml",
  "application/javascript",
  "application/x-yaml",
  "application/yaml",
  "image/png",
  "image/jpeg",
  "image/webp"
]
max_files = 3
max_size_mb = 5

[features.audio]
enabled = false
sample_rate = 24000

[features.mcp]
enabled = false

[features.mcp.user_servers]
enabled = false
allowed_urls = []

[UI]
name = "Nimi"
description = "Nimi - One AI. Infinite Possibilities."
logo_file_url = "/public/nimi-logo.svg?v=5"
custom_meta_image_url = "/public/nimi-logo.svg?v=5"
custom_js = "/public/pwa.js?v=5"
confirm_new_chat = true
cot = "full"
alert_style = "classic"
default_avatar_file_url = "/public/nimi-infinity.svg?v=5"
custom_css = "/public/nimi-theme.css?v=1"
layout = "wide"

[UI.theme]
default = "dark"
font_family = "Inter, ui-sans-serif, system-ui, sans-serif"

[UI.theme.light]
background = "#F7F6FC"
paper = "#FFFFFF"

[UI.theme.light.primary]
main = "#8057EF"
dark = "#6840D5"
light = "#B69BFF"

[UI.theme.light.text]
primary = "#201B2D"
secondary = "#716B80"

[UI.theme.dark]
background = "#090D1C"
paper = "#12182B"

[UI.theme.dark.primary]
main = "#A78BFA"
dark = "#8057EF"
light = "#C4B5FD"

[UI.theme.dark.text]
primary = "#F5F2FF"
secondary = "#B8B3CA"

[meta]
generated_by = "2.12.0"
