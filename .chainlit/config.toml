[project]
user_env = []
session_timeout = 3600
user_session_timeout = 1296000
cache = false
persist_user_env = false
mask_user_env = false
allow_origins = ["https://nimistaging.nimi.prod.page"]

[features]
unsafe_allow_html = false
latex = false
user_message_markdown = true
user_message_autoscroll = true
assistant_message_autoscroll = true
auto_tag_thread = true
edit_message = true
allow_thread_sharing = false
favorites = false

[features.slack]
reaction_on_message_received = false

[features.spontaneous_file_upload]
enabled = true
accept = ["application/pdf", "text/plain", "text/markdown", "text/csv", "image/png", "image/jpeg", "image/webp"]
max_files = 3
max_size_mb = 5

[features.audio]
enabled = false
sample_rate = 24000

[features.mcp]
enabled = false

[features.mcp.user_servers]
enabled = false
allowed_urls = []

[UI]
name = "Nimi"
description = "Nimi - One AI. Infinite Possibilities."
custom_js = "/public/pwa.js"
logo_file_url = "/public/nimi-logo.svg"
custom_meta_image_url = "/public/logo_dark.png"
confirm_new_chat = true
cot = "full"
alert_style = "classic"
default_avatar_file_url = "/public/icon-192.png"

[meta]
generated_by = "2.12.0"
